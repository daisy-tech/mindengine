## MindEngine local stack — Postgres + pgvector + Redis + backend + Celery (M1).
##
## Decision D1: episodic vectors are stored inside Postgres (pgvector),
## so there's no separate vector DB service.

name: mindengine

x-backend-base: &backend-base
  image: mindengine-backend:latest
  build:
    context: .
    dockerfile: Dockerfile
  env_file: .env
  # Inside the compose network, DB/Redis are reached by service name — NOT
  # localhost (which would point at the container itself). These override the
  # localhost URLs in .env, which remain correct for host-native dev
  # (uvicorn on Mac with ports 5432/6379 published).
  environment:
    DATABASE_URL: postgresql+asyncpg://mindengine:mindengine@postgres:5432/mindengine
    REDIS_URL: redis://redis:6379/0
  depends_on:
    postgres:
      condition: service_healthy
    redis:
      condition: service_healthy

services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: mindengine
      POSTGRES_PASSWORD: mindengine
      POSTGRES_DB: mindengine
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mindengine -d mindengine"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  backend:
    <<: *backend-base
    environment:
      DATABASE_URL: postgresql+asyncpg://mindengine:mindengine@postgres:5432/mindengine
      REDIS_URL: redis://redis:6379/0
      RUNTIME_KIND: web
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000"]
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/healthz"]
      interval: 10s
      timeout: 5s
      retries: 10

  celery:
    <<: *backend-base
    environment:
      DATABASE_URL: postgresql+asyncpg://mindengine:mindengine@postgres:5432/mindengine
      REDIS_URL: redis://redis:6379/0
      RUNTIME_KIND: worker
    # NOTE: explicit -Q list so memory.* fan-out (routed to
    # `mindengine.memory`) actually gets consumed by this worker.
    command: [
      "celery", "-A", "app.workers.celery_app:celery_app",
      "worker", "--loglevel=INFO",
      "-Q", "mindengine.default,mindengine.memory,mindengine.correction"
    ]

  celery-beat:
    <<: *backend-base
    environment:
      DATABASE_URL: postgresql+asyncpg://mindengine:mindengine@postgres:5432/mindengine
      REDIS_URL: redis://redis:6379/0
      RUNTIME_KIND: worker
    command: ["celery", "-A", "app.workers.celery_app:celery_app", "beat", "--loglevel=INFO"]

  # M5 — 小白前端 (Vue3 + nginx)
  # 与 backend 同一 compose network，nginx 反代 /api/* /auth/* /readyz
  # 所以前端不需要 CORS 配置。开发热刷新仍走 host 上的 vite (5173)。
  frontend:
    image: mindengine-frontend:latest
    build:
      context: ../frontend
      dockerfile: Dockerfile
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "5173:80"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://127.0.0.1/healthz || exit 1"]
      interval: 30s
      timeout: 3s
      retries: 3

volumes:
  pgdata:
