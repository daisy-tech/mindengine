# MindEngine frontend (nginx) — serves static SPA + reverse-proxies the
# backend so the browser sees one origin and SSE works without CORS.

upstream mindengine_backend {
  # In docker compose this name resolves to the backend service.
  server backend:8000;
}

server {
  listen 80 default_server;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  # SPA routing: any unknown path → index.html.
  location / {
    try_files $uri $uri/ /index.html;
  }

  location = /healthz {
    access_log off;
    add_header Content-Type text/plain;
    return 200 "ok\n";
  }

  # Auth + chat + memory + eval + conversations + readyz are all on the
  # backend. We disable proxy buffering on the chat path so SSE arrives
  # token-by-token.
  location /api/ {
    proxy_pass http://mindengine_backend;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_buffering off;
    proxy_cache off;
    chunked_transfer_encoding on;
    proxy_read_timeout 600s;
  }

  location /auth/ {
    proxy_pass http://mindengine_backend;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  }

  location /readyz {
    proxy_pass http://mindengine_backend;
  }
}
